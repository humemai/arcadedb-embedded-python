name: Build and Release Python Packages to PyPI

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'  # Matches: 25.10.1, 25.10.1.dev0, 25.10.1.post1, etc.

# WHICH ENGINE A RELEASE SHIPS depends on the kind of tag, which
# validate-version decides from the validated version and names in its summary.
#
# STABLE (X.Y.Z, X.Y.Z.postN; pom.xml must read exactly X.Y.Z): the wheels carry
# upstream's official jars, the ones in /home/arcadedb/lib of
# arcadedata/arcadedb:X.Y.Z (the artifacts Java users get), and both test
# workflows build and test the wheels on exactly those jars (jar-source
# `image`). A build of this commit from source exists in the release only as a
# gate (verify-engine-jars): publish needs it to find the same classes in the
# image, so what CI tested on every push, the engine built from this source, is
# the code that ships. The source build never enters a wheel or a test.
#
# DEV (X.Y.Z.devN, from main while pom.xml reads X.Y.Z-SNAPSHOT): no official
# image exists for an unreleased version, only upstream's moving snapshot, which
# can be newer or older than this commit. So a dev release builds, tests, and
# ships the jars built from this commit's source (jar-source `source`, the same
# jars every push is tested on), and the gate is skipped: there is nothing
# official to compare with.

jobs:
  # Validate version compatibility between tag and pom.xml
  validate-version:
    name: Validate Version Compatibility
    runs-on: ubuntu-24.04
    outputs:
      python-version: ${{ steps.validate.outputs.python-version }}
      base-version: ${{ steps.validate.outputs.base-version }}
      release-kind: ${{ steps.validate.outputs.release-kind }}
      jar-source: ${{ steps.validate.outputs.jar-source }}
      image-tag: ${{ steps.validate.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Validate version compatibility
        id: validate
        run: |
          cd bindings/python

          # Get version from git tag
          TAG_VERSION="${{ github.ref_name }}"
          echo "📌 Git tag version: $TAG_VERSION"

          # Extract base version from tag (remove .dev0, .post1, etc.)
          TAG_BASE=$(echo "$TAG_VERSION" | sed -E 's/\.(dev|post|rc|a|b)[0-9]+$//')
          echo "📌 Tag base version: $TAG_BASE"

          # Get version from pom.xml
          POM_VERSION=$(python3 scripts/extract_version.py --format=docker)
          echo "📌 pom.xml version: $POM_VERSION"

          # Extract base version from pom.xml (remove -SNAPSHOT, etc.)
          POM_BASE=$(echo "$POM_VERSION" | sed 's/-SNAPSHOT$//' | sed 's/-RC.*//')
          echo "📌 pom.xml base version: $POM_BASE"

          # Compare base versions
          if [ "$TAG_BASE" != "$POM_BASE" ]; then
            echo "❌ Version mismatch!"
            echo "   Tag base version: $TAG_BASE"
            echo "   pom.xml base version: $POM_BASE"
            echo ""
            echo "This prevents accidentally releasing the wrong version."
            echo "For example, tagging 25.9.1.dev0 when pom.xml says 25.10.1-SNAPSHOT"
            exit 1
          fi

          echo "✅ Version compatibility check passed!"
          echo "   Base version: $TAG_BASE"
          echo "   Full tag version: $TAG_VERSION"

          # DEV OR STABLE, from the validated version. A .devN tag ships the
          # jars built from this commit's source and skips the official-jar
          # gate. Every other tag is stable: it ships the official image of
          # its version, so pom.xml must read exactly that version (the image
          # tag), not a -SNAPSHOT for which no official image exists.
          if [[ "$TAG_VERSION" =~ \.dev[0-9]+$ ]]; then
            RELEASE_KIND=dev
            JAR_SOURCE=source
            IMAGE_TAG=""
            ENGINE="the jars built from this commit's source ($GITHUB_SHA); the official-jar gate is skipped, since no official image exists for an unreleased version"
          else
            if [ "$POM_VERSION" != "$TAG_BASE" ]; then
              echo "❌ $TAG_VERSION is a stable tag, but pom.xml reads $POM_VERSION, not $TAG_BASE."
              echo "   A stable release ships the official arcadedata/arcadedb:$TAG_BASE jars, so it must be"
              echo "   cut from a sync that stops at upstream's \"Set release version to $TAG_BASE\" commit."
              echo "   A pre-release from a -SNAPSHOT pom.xml is a .devN tag."
              exit 1
            fi
            RELEASE_KIND=stable
            JAR_SOURCE=image
            IMAGE_TAG="$POM_VERSION"
            ENGINE="upstream's official jars from arcadedata/arcadedb:$IMAGE_TAG, published only if they match a build of this commit's source (verify-engine-jars)"
          fi
          echo "📌 Release kind: $RELEASE_KIND; engine jars: $ENGINE"

          {
            echo "python-version=$TAG_VERSION"
            echo "base-version=$TAG_BASE"
            echo "release-kind=$RELEASE_KIND"
            echo "jar-source=$JAR_SOURCE"
            echo "image-tag=$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release $TAG_VERSION"
            echo ""
            echo "- Release kind: **$RELEASE_KIND** (pom.xml reads \`$POM_VERSION\`)"
            echo "- Engine jars built, tested, and shipped: $ENGINE"
          } >> "$GITHUB_STEP_SUMMARY"

  # The gate, stable tags only: the official jars must hold the classes of this
  # commit's engine source, the engine every push and pull request was tested
  # on. A dev tag ships that source build itself and has no official image.
  verify-engine-jars:
    name: Official jars match this commit's source
    needs: validate-version
    if: needs.validate-version.outputs.release-kind == 'stable'
    uses: ./.github/workflows/verify-engine-jars.yml
    with:
      image-tag: ${{ needs.validate-version.outputs.image-tag }}

  # Run example tests before building (workflow_call), on the jars the release
  # ships: the official image for a stable tag, this commit's source for a dev tag
  test-examples:
    name: Run Example Tests
    needs: validate-version
    uses: ./.github/workflows/test-python-examples.yml
    with:
      build-version: ${{ needs.validate-version.outputs.python-version }}
      jar-source: ${{ needs.validate-version.outputs.jar-source }}
      image-tag: ${{ needs.validate-version.outputs.image-tag }}
    secrets: inherit

  # Run unit tests before building, on the jars the release ships; these wheels publish
  test:
    name: Run Unit Tests
    needs: validate-version
    uses: ./.github/workflows/test-python-bindings.yml
    with:
      build-version: ${{ needs.validate-version.outputs.python-version }}
      jar-source: ${{ needs.validate-version.outputs.jar-source }}
      image-tag: ${{ needs.validate-version.outputs.image-tag }}
    secrets: inherit

  publish:
    name: Publish arcadedb-embedded to PyPI (4 platforms)
    needs: [validate-version, verify-engine-jars, test, test-examples]
    # The gate is skipped for a dev tag, and a skipped need would skip this job,
    # so the condition is spelled out: a stable tag needs the gate to pass, a
    # dev tag needs it skipped, and both need the tests to pass.
    if: >-
      ${{ !cancelled()
      && needs.validate-version.result == 'success'
      && needs.test.result == 'success'
      && needs.test-examples.result == 'success'
      && ((needs.validate-version.outputs.release-kind == 'stable' && needs.verify-engine-jars.result == 'success')
      || (needs.validate-version.outputs.release-kind == 'dev' && needs.verify-engine-jars.result == 'skipped')) }}
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't block GitHub Release if PyPI upload fails (size limit)
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels for all tested Python versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*-py*
          path: dist/
          merge-multiple: true

      - name: Verify wheels
        env:
          RELEASE_KIND: ${{ needs.validate-version.outputs.release-kind }}
          JAR_SOURCE: ${{ needs.validate-version.outputs.jar-source }}
          IMAGE_TAG: ${{ needs.validate-version.outputs.image-tag }}
        run: |
          ls -lh dist/
          echo "📦 Wheels for PyPI (current platforms):"
          ls dist/*.whl

          # Count wheels (should be 20: 4 platforms x 5 Python versions)
          WHEEL_COUNT=$(ls dist/*.whl | wc -l)
          echo "📊 Wheel count: $WHEEL_COUNT (expected: 20)"

          echo ""
          echo "ℹ️  Current PyPI platforms: linux x86_64, linux arm64, macOS Apple Silicon, windows x86_64"

          if [ "$WHEEL_COUNT" -ne 20 ]; then
            echo "❌ Expected 20 wheels (4 platforms x 5 Python versions), got $WHEEL_COUNT"
            exit 1
          fi

          # Show checksums to verify wheels are different
          echo ""
          echo "🔐 Wheel checksums (SHA256):"
          sha256sum dist/*.whl

          # Report wheel sizes with actual component breakdown
          {
            echo ""
            echo "## 📦 Built Wheels"
            echo ""
            if [ "$RELEASE_KIND" = "dev" ]; then
              echo "Release kind **dev**: engine jars built from this commit's source (\`$GITHUB_SHA\`); official-jar gate skipped"
            else
              echo "Release kind **$RELEASE_KIND**: upstream's official engine jars from \`arcadedata/arcadedb:$IMAGE_TAG\` (jar-source $JAR_SOURCE), matched against a build of this commit"
            fi
            echo ""
            echo "| Platform | Wheel Size | JRE Size | JARs Size | Installed Size | SHA256 (first 8 chars) |"
            echo "|----------|------------|----------|-----------|----------------|------------------------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for WHEEL_FILE in dist/*.whl; do
            WHEEL_NAME=$(basename "$WHEEL_FILE")
            WHEEL_SIZE_BYTES=$(stat -c%s "$WHEEL_FILE")
            WHEEL_SIZE_MB=$(echo "scale=1; $WHEEL_SIZE_BYTES / 1024 / 1024" | bc)

            # Extract platform from filename
            if [[ "$WHEEL_NAME" == *"manylinux"*"x86_64"* ]]; then
              PLATFORM="linux/amd64"
            elif [[ "$WHEEL_NAME" == *"manylinux"*"aarch64"* ]]; then
              PLATFORM="linux/arm64"
            elif [[ "$WHEEL_NAME" == *"macosx"*"arm64"* ]]; then
              PLATFORM="darwin/arm64"
            # elif [[ "$WHEEL_NAME" == *"macosx"*"x86_64"* ]]; then
            #   PLATFORM="darwin/amd64"
            elif [[ "$WHEEL_NAME" == *"win_amd64"* ]]; then
              PLATFORM="windows/amd64"
            else
              PLATFORM="unknown"
            fi

            # Analyze wheel contents
            TEMP_DIR=$(mktemp -d)
            unzip -q "$WHEEL_FILE" -d "$TEMP_DIR"

            # Calculate component sizes (find jre directory anywhere)
            JRE_DIR=$(find "$TEMP_DIR" -type d -name "jre" | head -n1)
            if [ -n "$JRE_DIR" ] && [ -d "$JRE_DIR" ]; then
              JRE_SIZE_BYTES=$(du -sb "$JRE_DIR" | cut -f1)
              JRE_SIZE_MB=$(echo "scale=1; $JRE_SIZE_BYTES / 1024 / 1024" | bc)
            else
              JRE_SIZE_MB="N/A"
            fi

            JAR_SIZE_BYTES=$(find "$TEMP_DIR" -name "*.jar" -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1)
            if [ -n "$JAR_SIZE_BYTES" ] && [ "$JAR_SIZE_BYTES" != "0" ]; then
              JAR_SIZE_MB=$(echo "scale=1; $JAR_SIZE_BYTES / 1024 / 1024" | bc)
            else
              JAR_SIZE_MB="N/A"
            fi

            INSTALLED_SIZE_BYTES=$(du -sb "$TEMP_DIR" | cut -f1)
            INSTALLED_SIZE_MB=$(echo "scale=0; $INSTALLED_SIZE_BYTES / 1024 / 1024" | bc)

            # Calculate SHA256 checksum
            CHECKSUM=$(sha256sum "$WHEEL_FILE" | cut -d' ' -f1 | cut -c1-8)

            rm -rf "$TEMP_DIR"

            echo "| $PLATFORM | ${WHEEL_SIZE_MB}M | ${JRE_SIZE_MB}M | ${JAR_SIZE_MB}M | ~${INSTALLED_SIZE_MB}M | \`$CHECKSUM\` |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: Sizes are uncompressed except for Wheel Size (compressed)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Verify wheel versions
        run: |
          TAG_VERSION="${{ needs.validate-version.outputs.python-version }}"
          EXPECTED_VERSION="$TAG_VERSION"

          for WHEEL_FILE in dist/*.whl; do
            echo "📦 Checking: $WHEEL_FILE"
            # Extract version from wheel filename
            WHEEL_VERSION=$(echo "$WHEEL_FILE" | grep -oP '\d+\.\d+\.\d+(\.(dev|post|rc|a|b)\d+)?')
            echo "   Version: $WHEEL_VERSION"

            if [ "$WHEEL_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "❌ Wheel version mismatch in $WHEEL_FILE!"
              echo "   Expected: $EXPECTED_VERSION"
              exit 1
            fi
          done
          echo "✅ All wheel versions match expected version ($EXPECTED_VERSION)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
