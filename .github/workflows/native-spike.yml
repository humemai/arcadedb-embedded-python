name: Native spike (shared library)

# Feasibility spike, branch native-spike only. Not a product, never merged.
# Builds ArcadeDB (the wheel's module set) as a GraalVM native-image shared library
# and smoke-tests it through ctypes. Timings come from a shared runner: not for claims.
on:
  push:
    branches:
      - native-spike

concurrency:
  group: native-spike
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: libarcadedb.so (linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same builder as ArcadeData/arcadedb native/pom.xml (native.graalvm.version).
      - name: Set up GraalVM (Community 25.0.2)
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.1
        with:
          java-version: "25.0.2"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"

      - name: Add swap
        run: |
          set -euo pipefail
          sudo fallocate -l 8G /swapfile.native
          sudo chmod 600 /swapfile.native
          sudo mkswap /swapfile.native
          sudo swapon /swapfile.native
          free -m

      - name: Check the jar set against bindings/python/scripts/jar_exclusions.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mvn -B -q --no-transfer-progress -f native-spike/pom.xml dependency:list \
            -DincludeScope=runtime -DoutputFile="$PWD/out/jars.txt"
          sed 's/^ *//' out/jars.txt | awk -F: 'NF>=5{print $2"-"$(NF-1)".jar"}' | sort > out/jar-names.txt
          bad=0
          while IFS= read -r pattern; do
            pattern="${pattern%$'\r'}"
            [[ -z "$pattern" || "${pattern#\#}" != "$pattern" ]] && continue
            while IFS= read -r name; do
              # shellcheck disable=SC2053
              if [[ "$name" == $pattern ]]; then echo "EXCLUDED JAR PRESENT: $name (pattern $pattern)"; bad=1; fi
            done < out/jar-names.txt
          done < bindings/python/scripts/jar_exclusions.txt
          wc -l out/jar-names.txt
          exit $bad

      - name: Is --emit build-report available?
        id: report
        shell: bash
        run: |
          set -euo pipefail
          if native-image --help-extra 2>&1 | grep -q 'build-report'; then
            echo "profile=-Preport" >> "$GITHUB_OUTPUT"; echo "build-report: available"
          else
            echo "profile=" >> "$GITHUB_OUTPUT"; echo "build-report: not available"
          fi

      - name: Build libarcadedb.so (default CPU target)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          mvn -B --no-transfer-progress -f native-spike/pom.xml ${{ steps.report.outputs.profile }} -DskipTests package 2>&1 | tee out/build.log
          echo "BUILD_SECONDS_default=$(( $(date +%s) - start ))" | tee -a out/sizes.txt
          mkdir -p out/default
          cp native-spike/target/libarcadedb.so native-spike/target/lib*_dynamic.h native-spike/target/libarcadedb.h native-spike/target/graal_isolate.h out/default/
          cp native-spike/target/libjsvml.so native-spike/target/libmanagement_ext.so out/default/ 2>/dev/null || true
          cp /tmp/native-image-build-output.json out/default/build-output.json 2>/dev/null || true

      - name: Build libarcadedb.so (-march=compatibility)
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          rm -f native-spike/target/libarcadedb.* native-spike/target/lib*_dynamic.h
          export NATIVE_IMAGE_OPTIONS="${NATIVE_IMAGE_OPTIONS:-} -march=compatibility"
          mvn -B --no-transfer-progress -f native-spike/pom.xml -DskipTests package 2>&1 | tee out/build-compat.log
          echo "BUILD_SECONDS_compat=$(( $(date +%s) - start ))" | tee -a out/sizes.txt
          mkdir -p out/compat
          cp native-spike/target/libarcadedb.so out/compat/
          cp /tmp/native-image-build-output.json out/compat/build-output.json 2>/dev/null || true

      - name: Sizes
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          for v in default compat; do
            so=out/$v/libarcadedb.so
            [[ -f "$so" ]] || continue
            echo "[$v] so_bytes=$(stat -c %s "$so")" | tee -a out/sizes.txt
            gzip -9 -c "$so" > out/$v/libarcadedb.so.gz
            echo "[$v] so_gzip9_bytes=$(stat -c %s out/$v/libarcadedb.so.gz)" | tee -a out/sizes.txt
            (cd out/$v && zip -9 -q libarcadedb.zip libarcadedb.so)
            echo "[$v] so_zip9_bytes=$(stat -c %s out/$v/libarcadedb.zip)" | tee -a out/sizes.txt
            rm -f out/$v/libarcadedb.so.gz out/$v/libarcadedb.zip.tmp
            ldd "$so" | tee out/$v/ldd.txt
          done
          ls -l out/default | tee -a out/sizes.txt
          for f in build.log build-compat.log; do
            sed -n '/GraalVM Native Image: Generating/,/Finished generating/p' out/$f > out/image-breakdown-$f.txt || true
          done
          cat out/image-breakdown-build.log.txt || true
          grep -n -i -E 'warning.*(reflection|resource|metadata)|Could not resolve|not found|unresolved' out/build.log | grep -v 'Configuration directory not found' | head -60 > out/metadata-warnings.txt || true
          find native-spike/target -name '*build-report*' | head

      - name: Smoke test through ctypes
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          # The .so alone in an empty directory: no companion libraries next to it.
          for v in default compat; do
            d=$(mktemp -d); cp out/$v/libarcadedb.so "$d/"
            for run in 1 2 3; do
              python3 -I native-spike/smoke.py "$d/libarcadedb.so" > out/smoke-$v-$run.out 2>&1
              rc=$?; echo "smoke_rc[$v,$run]=$rc" | tee -a out/sizes.txt
              grep -E '^RESULTS|SMOKE PASSED' out/smoke-$v-$run.out | cut -c1-1500
              [[ $rc -eq 0 ]] || fail=1
            done
          done
          # With the companion libraries (libjsvml.so, libmanagement_ext.so) next to it.
          python3 -I native-spike/smoke.py out/default/libarcadedb.so > out/smoke-default-with-companions.out 2>&1
          echo "smoke_rc[default,companions]=$?" | tee -a out/sizes.txt
          exit $fail

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-spike-linux-x86_64
          path: |
            out/
          if-no-files-found: warn
          retention-days: 14
