# Builds the documentation site with --strict, so a broken link, a page missing from the
# nav or a bad include fails the pull request that caused it. Documentation changes do not
# start the test matrix (test-python-bindings.yml runs when code changes), and this is the
# check that covers them. It does not run the code blocks in the pages: tests/test_docs_examples.py
# does, needs the built wheel, and runs in the release workflow; see "Documentation Development".
#
# Fork-only: upstream has no such site, so this is absent from make-upstream-pr-branch.sh's
# INCLUDE_PATHS and present in sync-upstream.sh's FORK_GITHUB_ALLOWLIST.
name: Docs Build

on:
  pull_request:
    paths:
      - 'bindings/python/docs/**'
      - 'bindings/python/mkdocs.yml'
      - '.github/workflows/docs-build.yml'
  push:
    branches:
      - main
    paths:
      - 'bindings/python/docs/**'
      - 'bindings/python/mkdocs.yml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the git-revision-date plugin reads each page's history

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup UV package manager
        run: |
          # Same pinned version and retry pattern as the test workflows: the script is downloaded first so a retried
          # transfer is never piped half-written into sh.
          installer="$(mktemp)"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 -o "$installer" https://astral.sh/uv/0.12.0/install.sh
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          uv --version

      # Pinned to the versions the site was last built with, so a new release of the theme
      # cannot turn a pull request red for a reason that is not in the pull request.
      # Same versions as deploy-python-docs.yml, so the deployed site is built with what CI checked. Change both together.
      - name: Build the site (warnings are errors)
        working-directory: bindings/python
        run: uvx --from "mkdocs==1.6.1" --with "mkdocs-material==9.7.7" --with "mkdocs-git-revision-date-localized-plugin==1.6.0" --with "mkdocs-macros-plugin==1.5.0" mkdocs build --strict -f mkdocs.yml
