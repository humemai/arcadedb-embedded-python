# arcadedb-native: a dependency-only alias that installs arcadedb-embedded-native of the same version. It holds the PyPI name
# the native build moves to when it leaves preview (release.md, Native Preview Releases): then this name ships the native wheel
# itself, with `import arcadedb`, and this workflow is replaced.
#
#   push of a tag native-v<version>   wait until arcadedb-embedded-native <version> is on PyPI (native-preview.yml publishes it from
#                                     the same tag), then build arcadedb-native <version> (sdist + py3-none-any wheel) and publish it.
#
# PyPI side: pending/active trusted publisher for humemai/arcadedb-embedded-python, workflow native-alias.yml, environment
# pypi-native (allows native-v* tags only). No API token.
name: Native alias package

on:
  push:
    tags:
      - "native-v*"

concurrency:
  group: native-alias-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.12.0"

jobs:
  alias:
    name: Publish the arcadedb-native alias
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: pypi-native
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the version from the tag
        id: v
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#native-v}"
          # Same rule as the release workflows: X.Y.Z, X.Y.Z.devN (N from 0) or X.Y.Z.postN (N from 1).
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.dev(0|[1-9][0-9]*)|\.post[1-9][0-9]*)?$ ]] || { echo "tag $GITHUB_REF_NAME is not native-v<X.Y.Z[.devN|.postN]>" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for arcadedb-embedded-native on PyPI
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/arcadedb-embedded-native/${VERSION}/json"; then echo "arcadedb-embedded-native ${VERSION} is on PyPI"; exit 0; fi
            sleep 60
          done
          echo "arcadedb-embedded-native ${VERSION} did not appear on PyPI within 100 minutes" >&2
          exit 1

      - name: Install uv
        run: |
          installer="$(mktemp)"
          curl -LsSf --retry 5 --retry-all-errors --retry-delay 5 -o "$installer" "https://astral.sh/uv/${UV_VERSION}/install.sh"
          sh "$installer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the alias
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p alias
          cp LICENSE alias/LICENSE
          cat > alias/README.md <<EOF
          # arcadedb-native

          Alias for [arcadedb-embedded-native](https://pypi.org/project/arcadedb-embedded-native/) ${VERSION}: ArcadeDB embedded in
          Python as a GraalVM Community Edition native image, without a JVM. Installing this installs that package of the same version;
          import it as \`arcadedb_native\`. It is a preview (\`pip install --pre arcadedb-native\`).

          When the native build leaves preview, this name ships the native wheel itself. The JVM build is
          [arcadedb-embedded](https://pypi.org/project/arcadedb-embedded/). Source: https://github.com/humemai/arcadedb-embedded-python
          EOF
          sed -i 's/^          //' alias/README.md
          cat > alias/pyproject.toml <<EOF
          [build-system]
          # 77 or newer: the SPDX license expression below
          requires = ["setuptools>=77"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "arcadedb-native"
          version = "${VERSION}"
          description = "Alias for arcadedb-embedded-native: ArcadeDB embedded in Python as a GraalVM native image (preview)"
          readme = "README.md"
          license = "Apache-2.0"
          license-files = ["LICENSE"]
          requires-python = ">=3.11"
          dependencies = ["arcadedb-embedded-native==${VERSION}"]
          classifiers = [
            "Development Status :: 3 - Alpha",
            "Programming Language :: Python :: 3",
            "Topic :: Database",
          ]

          [project.urls]
          Homepage = "https://github.com/humemai/arcadedb-embedded-python"
          Issues = "https://github.com/humemai/arcadedb-embedded-python/issues"

          [tool.setuptools]
          packages = []
          EOF
          sed -i 's/^          //' alias/pyproject.toml
          (cd alias && uv build --sdist --wheel --out-dir ../dist)
          ls -l dist
          [ -f "dist/arcadedb_native-${VERSION}-py3-none-any.whl" ] || { echo "unexpected wheel name" >&2; exit 1; }
          uvx twine check --strict dist/*
          # the wheel must contain no modules, only metadata
          ! unzip -l "dist/arcadedb_native-${VERSION}-py3-none-any.whl" | grep -E '\.py$'

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
