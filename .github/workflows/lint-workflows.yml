# Workflow hygiene checks that upstream runs and we did not.
#
# Fork-only on purpose. Upstream already runs the SHA-pin check in mvn-test.yml,
# so shipping this file to them via the bindings PR would just duplicate it.
# It is therefore absent from make-upstream-pr-branch.sh's INCLUDE_PATHS, and
# present in sync-upstream.sh's FORK_GITHUB_ALLOWLIST so the post-merge prune
# does not delete it.
#
# Why it exists: on 2026-08-04 the bindings PR added `actions/cache@v4` to a
# workflow. Every one of our 34 action references was SHA-pinned, so nothing
# here objected, and it went out. Upstream's setup job caught it immediately:
#
#   ##[error]actions/cache@v4 is not pinned to a full length commit SHA.
#
# It failed their gate and cascaded to 14 dependent jobs. We authored the file,
# so we should have been the ones to catch it. A floating tag is a supply-chain
# hole regardless of which repo the workflow runs in: the owner of that tag can
# repoint it at any commit, and CI has credentials.
name: Lint Workflows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sha-pinned-actions:
    name: Ensure SHA pinned actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same action and same pin upstream uses, so the two repos agree on what
      # "pinned" means rather than drifting into two dialects of the rule.
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5

  # Second half of the same lesson, found the same way. Upstream's setup job
  # also runs pre-commit, and we do not, so our formatting drifts here and is
  # only discovered when a bindings PR reaches them. On 2026-08-04 that PR
  # failed their gate twice in a row: first on an unpinned action, then on
  # isort and black. Both were ours, neither was visible from this repo.
  #
  # It also showed the drift is not only in new code. isort moved the `server`
  # import too, which has been misordered here since server mode was restored,
  # because nothing local ever checked.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Scoped to bindings/python, NOT --all-files, and the difference matters.
      # Repo-wide, end-of-file-fixer rewrites 400+ raw result JSONs under
      # benchmarks/experiments/results/ to add trailing newlines. Those are
      # measurement artifacts, not source: churning them buys nothing, and a
      # formatter that edits recorded data is a bad idea on principle.
      #
      # bindings/python is also exactly the surface upstream receives, so this
      # job answers the question that actually bites us: would our next PR pass
      # their pre-commit gate?
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --files $(git ls-files 'bindings/python/**')

  # The test workflows list what triggers them (an allowlist), so a new tracked top-level entry
  # under bindings/python would silently not start CI unless someone decides about it. This job
  # makes that decision a failure: every entry is either covered by both workflows' path lists or
  # named below as documentation/metadata that needs no test run.
  ci-trigger-coverage:
    name: CI triggers cover every bindings/python entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the trigger paths against the tracked entries
        run: |
          python3 -m pip install --quiet "pyyaml==6.0.3"
          python3 - <<'PY'
          import subprocess, sys, yaml
          # Entries that never need the test matrix. Documentation is built by docs-build.yml.
          NO_TEST_RUN = {".gitignore", "AGENTS.md", "CLAUDE.md", "README.md", "docs", "mkdocs.yml"}
          WORKFLOWS = ["test-python-bindings.yml", "test-python-examples.yml"]
          files = subprocess.check_output(["git", "ls-files", "bindings/python"], text=True).split("\n")
          entries = {f.split("/")[2] for f in files if f.count("/") >= 2}
          problems = []
          for wf in WORKFLOWS:
              on = yaml.safe_load(open(".github/workflows/" + wf))[True]
              for event in ("pull_request", "push"):
                  paths = [p for p in on[event]["paths"] if not p.startswith("!")]
                  for e in sorted(entries):
                      base = "bindings/python/" + e
                      covered = any(p == base or p.startswith(base + "/") for p in paths)
                      if covered and e in NO_TEST_RUN:
                          problems.append(f"{wf} {event}: {e} triggers the matrix but is listed as needing no test run")
                      if not covered and e not in NO_TEST_RUN:
                          problems.append(f"{wf} {event}: new entry bindings/python/{e} is not in the trigger paths; add it there, or to NO_TEST_RUN in lint-workflows.yml if it needs no test run")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print("every tracked bindings/python entry is decided:", ", ".join(sorted(entries)))
          PY
