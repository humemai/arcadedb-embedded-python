# Force-inline the scalar distance path of jvector 4.0.2 (the provider every native image uses: -H:-VectorAPISupport, see
# oracle/graal#14751). Measured with untimed profiles on the baseline image (-march=compatibility), 50k x 128-d L2 graph: ArrayVectorFloat.length,
# a one-line getter, stayed a call and took 31% of the samples; with these filters it takes 0%, the graph build went from 94.2 s to 76.1 s
# and a search from 1.07 ms to 0.89 ms. The dotProduct and cosine entries are the same scalar counterparts for DOT_PRODUCT and COSINE
# indexes (not profiled; the same getters sit in their loops). A filter without a signature matches every overload. This file is read from
# the glue jar on the image build classpath; preview-build.sh fails the build when the log does not show the option as picked up.
Args = -H:PriorityForceInline=io.github.jbellis.jvector.vector.ArrayVectorFloat.length,io.github.jbellis.jvector.vector.ArrayVectorFloat.get,io.github.jbellis.jvector.vector.VectorUtil.squareL2Distance,io.github.jbellis.jvector.vector.VectorUtil.dotProduct,io.github.jbellis.jvector.vector.VectorUtil.cosine,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.squareDistance,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.squareDistanceUnrolled,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.dotProduct,io.github.jbellis.jvector.vector.DefaultVectorUtilSupport.cosine
