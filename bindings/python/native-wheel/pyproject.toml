# Template: build_wheel.py copies this into a staging directory next to the generated src/arcadedb_native tree and replaces @VERSION@.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcadedb-embedded-native"
version = "@VERSION@"
description = "PREVIEW: ArcadeDB embedded as a GraalVM native-image library. No JVM, no JPype. Installs beside arcadedb-embedded."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/**"]
authors = [{ name = "Taewoon Kim", email = "taewoon@humem.ai" }]
keywords = ["database", "graph", "document", "multi-model", "arcadedb", "embedded", "native-image", "graalvm", "preview"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.26.4"]
arrow = ["pyarrow>=23.0.1", "numpy>=1.26.4"]
pandas = ["pandas>=2.2.0", "numpy>=1.26.4"]
polars = ["polars>=1.0", "pyarrow>=23.0.1", "numpy>=1.26.4"]

[project.urls]
Homepage = "https://github.com/humemai/arcadedb-embedded-python"
Repository = "https://github.com/humemai/arcadedb-embedded-python"
"Bug Tracker" = "https://github.com/humemai/arcadedb-embedded-python/issues"
"ArcadeDB Upstream" = "https://github.com/ArcadeData/arcadedb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcadedb_native = ["_native/*.so", "_native/*.dylib", "_native/*.dll"]
