site_name: ArcadeDB Python Bindings
site_url: https://docs.humem.ai/arcadedb
site_description: Native Python bindings for ArcadeDB - the multi-model database
site_author: humemai
repo_url: https://github.com/humemai/arcadedb-embedded-python
repo_name: humemai/arcadedb-embedded-python
edit_uri: edit/main/bindings/python/docs/

copyright: Copyright &copy; 2026 humemai

theme:
  name: material
  language: en
  # HumemAI design system (github.com/humemai/design-system), vendored in
  # docs/brand: oxblood palette, Schibsted Grotesk + DM Mono (Newsreader
  # headings come from brand/css/mkdocs.css), the white mark in the header.
  font:
    text: Schibsted Grotesk
    code: DM Mono
  logo: brand/logo/mark-white.svg
  favicon: brand/export/favicon.svg
  palette:
    # Light mode
  - scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
    # Dark mode
  - scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode

  features:
    # Navigation
  - navigation.instant          # Fast page loading
  - navigation.tracking         # URL updates as you scroll
  - navigation.tabs             # Top-level tabs
  - navigation.tabs.sticky      # Sticky tabs
  - navigation.sections         # Sections in nav
  - navigation.path             # Breadcrumbs
  - navigation.indexes          # Section index pages
  - navigation.top              # Back to top button
  - navigation.footer           # Previous/next navigation
  - navigation.prune            # Prune navigation for large sites

    # Search
  - search.suggest              # Search suggestions
  - search.highlight            # Highlight search terms
  - search.share                # Share search results

    # Header
  - header.autohide            # Hide header on scroll

    # Content
  - content.code.copy           # Copy code button
  - content.code.annotate       # Code annotations
  - content.tabs.link           # Link content tabs
  - content.tooltips            # Tooltips

    # Table of contents
  - toc.follow                  # TOC follows scroll
  - toc.integrate               # TOC in nav

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - en
- git-revision-date-localized:
    enable_creation_date: true
    type: timeago
- macros:
    include_dir: .

markdown_extensions:
  # Python Markdown
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- toc:
    permalink: true
    toc_depth: 3

  # Python Markdown Extensions
- pymdownx.betterem:
    smart_enable: all
- pymdownx.caret
- pymdownx.details
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/humemai/arcadedb-embedded-python
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/arcadedb-embedded/
  version:
    provider: mike
  version_tag: !ENV [MIKE_VERSION, latest]

# The vendored design system's bookkeeping stays out of the built site.
exclude_docs: |
  brand/VERSION.md
  brand/verify.sh

extra_css:
- brand/css/mkdocs.css
- stylesheets/extra.css

